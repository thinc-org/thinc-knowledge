<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Thinc favicon: the bulb mark on its own dark tile. The brand mark is pure
    white with amber filament bars and no currentColor, so on a bare light
    browser tab it would vanish. The rounded near-black tile carries the mark
    so it reads on any tab, light or dark, and matches the site's night ground.
  -->
  <defs>
    <radialGradient id="thincIconGlow" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#4A360F"/>
      <stop offset="52%" stop-color="#161514"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="#0A0A0B"/>
  <rect width="512" height="512" rx="116" fill="url(#thincIconGlow)" opacity="0.85"/>
